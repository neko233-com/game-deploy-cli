name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
            archive: tar.gz
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
            archive: tar.gz
          - os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
            archive: tar.gz
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64
            archive: tar.gz
          - os: windows
            arch: amd64
            goos: windows
            goarch: amd64
            archive: zip
          - os: windows
            arch: arm64
            goos: windows
            goarch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          mkdir -p out/package
          binary="game-deploy"
          if [ "$GOOS" = "windows" ]; then binary="game-deploy.exe"; fi
          go build -trimpath -ldflags "-s -w -X github.com/neko233-com/game-deploy-cli/internal/build.Version=${GITHUB_REF_NAME}" -o "out/package/$binary" ./cmd/game-deploy
          asset="game-deploy-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd out/package && zip -q -r "../$asset.zip" "$binary")
          else
            tar -czf "out/$asset.tar.gz" -C out/package "$binary"
          fi
          sha256sum "out/$asset.${{ matrix.archive }}" > "out/$asset.${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: game-deploy-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
